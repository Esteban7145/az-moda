<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#100c0b"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"><title>Administración — AZ MODA</title></head><body data-page="admin"><main class="admin-page"><section id="admin-login" class="admin-login"><a class="brand" href="index.html">AZ <span>Moda</span></a><p class="kicker">Acceso privado</p><h1>Administración</h1><form id="login-form"><label>Correo<input type="email" name="email" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-coral" type="submit">Ingresar</button><p id="login-status" class="form-status" role="status"></p></form></section><section id="admin-panel" hidden><header class="admin-header"><div><p class="kicker">Panel AZ MODA</p><h1>Tienda</h1></div><div><a class="button" href="tienda.html" target="_blank">Ver tienda</a><button id="logout" class="button">Cerrar sesión</button></div></header><nav class="admin-tabs" aria-label="Secciones de administración"><button class="is-active" data-admin-tab="products">Productos</button><button data-admin-tab="orders">Pedidos</button><button data-admin-tab="settings">Transferencias</button></nav><section data-admin-panel="products"><div class="admin-grid"><form id="product-form" class="admin-form"><input type="hidden" name="id"><h2>Producto</h2><label>Nombre<input name="name" required maxlength="100"></label><label>Categoría<select name="category_id" id="admin-category" required></select></label><label>Descripción<textarea name="description" required maxlength="700" rows="4"></textarea></label><div class="form-row"><label>Precio COP<input name="price_cop" type="number" min="0" step="100" required></label><label>Unidades<input name="stock" type="number" min="0" step="1" required value="0"></label></div><label>Tallas <small>separadas por coma</small><input name="sizes" placeholder="S, M, L"></label><label>Colores <small>separados por coma</small><input name="colors" placeholder="Negro, Blanco"></label><label>Fotografía<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="consent"><input name="active" type="checkbox" checked> Visible en la tienda</label><button class="button button-coral" type="submit">Guardar producto</button><button class="text-link" id="cancel-product" type="button">Limpiar formulario</button><p id="product-status" class="form-status"></p></form><div><h2>Productos publicados</h2><div id="admin-products" class="admin-list"></div></div></div></section><section data-admin-panel="orders" hidden><header class="admin-section-head"><h2>Pedidos</h2><button id="refresh-orders" class="button">Actualizar</button></header><div id="admin-orders" class="admin-orders"></div></section><section data-admin-panel="settings" hidden><form id="bank-form" class="admin-form bank-form"><h2>Datos para transferencia</h2><p>Estos datos solo aparecen al cliente cuando activas las transferencias.</p><label class="consent"><input name="enabled" type="checkbox"> Activar pago por transferencia</label><label>Banco<input name="bank_name" maxlength="80"></label><label>Tipo de cuenta<input name="account_type" maxlength="50"></label><label>Número de cuenta<input name="account_number" maxlength="60"></label><label>Titular<input name="account_holder" maxlength="100"></label><label>Documento del titular<input name="holder_document" maxlength="40"></label><button class="button button-coral" type="submit">Guardar datos</button><p id="bank-status" class="form-status"></p></form></section></section></main><script src="store-config.js"></script><script src="admin.js"></script></body></html>
